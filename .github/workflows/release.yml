name: Build and publish NEZER LAUNCHER

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate version and release tag
        id: meta
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$appVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $appVersion"
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --ignore-scripts=false --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path release/latest.yml)) { throw "latest.yml was not generated" }
          if (-not (Get-ChildItem release -Filter *.exe)) { throw "NSIS installer was not generated" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NEZER LAUNCHER v${{ steps.meta.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
