name: Restore NEZER LAUNCHER source files

on:
  push:
    branches: [main]
    paths:
      - '.nezer-source-parts/part-08.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack bundled source files
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, pathlib, tarfile
          root = pathlib.Path('.').resolve()
          parts = sorted(pathlib.Path('.nezer-source-parts').glob('part-*.b64'))
          assert len(parts) == 8, f'Expected 8 source parts, found {len(parts)}'
          archive = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tar:
              for item in tar:
                  name = pathlib.PurePosixPath(item.name)
                  if item.issym() or item.islnk() or item.isdir() or name.is_absolute() or '..' in name.parts:
                      raise ValueError(f'Unsupported archive entry: {item.name}')
                  if name.parts[0] not in ('src', 'electron', 'tests', 'build'):
                      raise ValueError(f'Unexpected source path: {item.name}')
                  content = tar.extractfile(item).read()
                  output = root.joinpath(*name.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(content)
          print('Restored:', ', '.join(str(p) for p in parts))
          PY
      - name: Commit restored source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src electron tests build
          if git diff --cached --quiet; then
            echo "Source already present"
          else
            git commit -m "feat: restore full NEZER LAUNCHER source from bundle"
            git push origin HEAD:main
          fi
